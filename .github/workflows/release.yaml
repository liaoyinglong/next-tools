name: Release

on: workflow_dispatch

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        # NODE_AUTH_TOKEN 为空是刻意的：发布走 npm trusted publishing（OIDC）。
        # 依赖 workflow 级 `id-token: write` 权限和 setup-node 提供的
        # npm >= 11.5（含 Node 24 自带版本）。不要在此处填入静态 token。
        run: NODE_AUTH_TOKEN="" pnpm run release

      - name: Commit and push tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          TAGS=$(git tag --points-at HEAD | sort)
          if [ -n "$TAGS" ]; then
            BODY=$(echo "$TAGS" | sed 's/^/- /')
            git commit -m "ci: release [skip ci]

          Publish

          $BODY" || echo "No changes to commit"
          else
            git commit -m "ci: release [skip ci]" || echo "No changes to commit"
          fi
          git push --follow-tags
